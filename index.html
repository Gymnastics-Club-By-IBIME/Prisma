<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBIME — Gymnastics Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/shared.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      letter-spacing: 0.08em;
      color: #f1f5f9;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 1rem;
      margin-bottom: 3rem;
      text-align: center;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 860px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1.25rem;
      padding: 2rem 1.5rem;
      text-align: center;
      text-decoration: none;
      color: #f1f5f9;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      border-color: #6366f1;
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(99,102,241,0.2);
    }
    .card .icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .card .label {
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }
    .card .desc {
      font-size: 0.82rem;
      color: #94a3b8;
    }
    footer {
      margin-top: 3rem;
      color: #475569;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="logo">IBIME</div>
  <p class="subtitle">Gymnastics Club — Selecciona tu portal</p>

  <div class="cards">
    <a href="pages/admin_clases.html" class="card">
      <div class="icon">⚙️</div>
      <div class="label">Administración</div>
      <div class="desc">Gestión de clases y catálogo</div>
    </a>
    <a href="pages/alumno.html" class="card">
      <div class="icon">🎽</div>
      <div class="label">Alumno</div>
      <div class="desc">Reservas, pagos y estado en tiempo real</div>
    </a>
    <a href="pages/profesores.html" class="card">
      <div class="icon">🏅</div>
      <div class="label">Profesores</div>
      <div class="desc">Ver inscritos y pasar lista</div>
    </a>
    <a href="pages/recepcion.html" class="card">
      <div class="icon">🏢</div>
      <div class="label">Recepción</div>
      <div class="desc">Cobros, inscripciones y reservas</div>
    </a>
  </div>

  <footer>&copy; 2025 IBIME Gymnastics Club</footer>
</body>
</html>
